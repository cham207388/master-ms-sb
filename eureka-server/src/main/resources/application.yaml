server:
  port: 8070
spring:
  application:
    name: eureka-server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}


  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8070/eureka/}
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id}]"
  structured:
    format:
      console: ecs
      file: ecs
