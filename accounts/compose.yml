services:
  accounts-db:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=accounts'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5423:5432'
    volumes:
      - accounts-pg-volume:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounts" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - accounts

  accounts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounts-api
    ports:
      - '8091:8091'
    environment:
      - 'DB_NAME=accounts'
      - 'DB_HOST=accounts-db'
      - 'DB_PORT=5432'
      - 'DB_USERNAME=postgres'
      - 'DB_PASSWORD=postgres'
    depends_on:
      accounts-db:
        condition: service_healthy
    networks:
      - accounts

volumes:
  accounts-pg-volume:
networks:
  accounts:
    driver: bridge
