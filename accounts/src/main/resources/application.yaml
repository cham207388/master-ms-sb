server:
  port: 8091

spring:
  application:
    name: accounts
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5423/accounts
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    stream:
      bindings:
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
        sendCommunication-out-0:
          destination: send-communication # destination name in the message broker
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 10s

logging:
  level:
    org.springframework.amqp.rabbit.listener.BlockingQueueConsumer: ERROR
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: ERROR
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id}]"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
  endpoint:
    shutdown:
      enabled: true

endpoints:
  shutdown:
    enabled: true

eureka:
  instance:
    prefer-ip-address: true
    status-page-url: http://localhost:${server.port}/actuator/info
    health-check-url: http://localhost:${server.port}/actuator/health
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8070/eureka/}

info:
  app:
    name: ${spring.application.name}
    description: "Accounts Service"
    version: ${APP_VERSION:1.0.0}

cards:
  service:
    name: "cards"
    base:
      path: "/api/cards"

loans:
  service:
    name: "loans"
    base:
      path: "/api/loans"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions: # not required when retryExeptions is defined
          - java.lang.NullPointerException
#        retryExeptions: when defined,
#          - java.io.IOException
#          - org.springframework.web.client.HttpServerErrorException
  ratelimiter:
    configs:
      default:
        limitForPeriod: 1
        limitRefreshPeriod: 5000
        timeoutDuration: 1000