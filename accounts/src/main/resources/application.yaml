server:
  port: 8091

spring:
  application:
    name: accounts
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5423}/${DB_NAME:accounts}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"

logging:
  level:
    org.springframework.amqp.rabbit.listener.BlockingQueueConsumer: ERROR
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: ERROR

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    build:
      enabled: true
  endpoint:
    shutdown:
      enabled: true

endpoints:
  shutdown:
    enabled: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8070/eureka/}

info:
  app:
    name: ${spring.application.name}
    description: "Accounts Service"
    version: ${APP_VERSION:1.0.0}
