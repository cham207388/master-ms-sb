apiVersion: v1
kind: Secret
metadata:
  name: resend-secret
  labels:
    app: message
type: Opaque
stringData:
  # Replace before apply; never commit a real API key.
  RESEND_API_KEY: "replace-me"
  RESEND_FROM: "Securedbank <onboarding@resend.dev>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-deployment
  labels:
    app: message
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message
  template:
    metadata:
      labels:
        app: message
    spec:
      containers:
      - name: message
        image: baicham/securedbank-message:s18
        ports:
        - containerPort: 9010
        env:
        - name: SPRING_APPLICATION_NAME
          value: "message"
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: KAFKA_BROKER

        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: JAVA_TOOL_OPTIONS
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_EXPORTER_OTLP_PROTOCOL
        - name: OTEL_METRICS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_METRICS_EXPORTER
        - name: OTEL_LOGS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_LOGS_EXPORTER
        - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
        - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
        - name: OTEL_SERVICE_NAME
          value: "message"
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: resend-secret
              key: RESEND_API_KEY
        - name: RESEND_FROM
          valueFrom:
            secretKeyRef:
              name: resend-secret
              key: RESEND_FROM

        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
