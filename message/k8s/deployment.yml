apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-deployment
  labels:
    app: message
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message
  template:
    metadata:
      labels:
        app: message
    spec:
      containers:
      - name: message
        image: baicham/securedbank-message:s15
        ports:
        - containerPort: 9010
        env:
        - name: SPRING_APPLICATION_NAME
          value: "message"
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: KAFKA_BROKER
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
