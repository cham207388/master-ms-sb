server:
  port: 9010

spring:
  application:
    name: message
  cloud:
    function:
      definition: email|sms # combining multiple functions with pipe (|) separator as a single function definition
    stream:
      bindings:
        emailsms-in-0:
          destination: send-communication
          group: ${spring.application.name}
        emailsms-out-0:
          destination: communication-sent
      kafka:
        binder:
          brokers: ${KAFKA_BROKER:localhost:9092}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Securedbank <onboarding@resend.dev>}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id}]"
  level:
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer.internals.OffsetFetcherUtils: ERROR