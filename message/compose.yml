services:
  message:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: message
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_CONNECTION_TIMEOUT: 10s
      OTEL_SERVICE_NAME: message
    depends_on:
      rabbitmq:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./build.gradle
    extends:
      file: ../common-docker-config.yml
      service: microservice-base
