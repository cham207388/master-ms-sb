services:
  message:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: message
    environment:
      KAFKA_BROKER: kafka:19092
      OTEL_SERVICE_NAME: message
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Securedbank <onboarding@resend.dev>}
    depends_on:
      kafka:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./build.gradle
    extends:
      file: ../docker/common.yml
      service: microservice-base
