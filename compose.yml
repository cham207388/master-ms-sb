services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=microservice'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5423:5432'
    volumes:
      - pg-volume:/var/lib/postgresql
  # grafana-lgtm:
  #   image: 'grafana/otel-lgtm:0.29.0'
  #   ports:
  #     - '3000:3000'
  #     - '4317:4317' # gRPC
  #     - '4318:4318' # HTTP

volumes:
  pg-volume: