# Alternate full-stack compose: published API images, no Redis.
include:
  - docker-compose.dbs.yml
  - docker-compose-observability.yml
  - config-server/compose.yml
  - eureka-server/compose.yml
  - accounts/compose.image.yml
  - cards/compose.image.yml
  - loans/compose.image.yml

services:
  gateway-server:
    build:
      context: ./gateway-server
      dockerfile: Dockerfile
    container_name: gateway-server
    ports:
      - '8072:8072'
    environment:
      OTEL_SERVICE_NAME: gateway-server
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:7080/realms/securedbankdev/protocol/openid-connect/certs
    depends_on:
      - accounts-api
      - cards-api
      - loans-api
    extends:
      file: common-docker-config.yml
      service: microservice-with-config-eureka

volumes:
  accounts-pg-volume:
  cards-pg-volume:
  loans-pg-volume:

networks:
  securedbank:
    driver: bridge
  loki:
