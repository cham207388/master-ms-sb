apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cards-db
spec:
  podSelector:
    matchLabels:
      app: cards-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cards
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cards
spec:
  podSelector:
    matchLabels:
      app: cards
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-server
        - podSelector:
            matchLabels:
              app: accounts
      ports:
        - protocol: TCP
          port: 8092
