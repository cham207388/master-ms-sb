apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server-deployment
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
      - name: eureka-server
        image: baicham/securedbank-eureka-server:s15
        ports:
        - containerPort: 8070
        env:
        - name: SPRING_APPLICATION_NAME
          value: "eureka-server"
        - name: CONFIG_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: CONFIG_SERVER_URL
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_DEFAULT_ZONE
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: EUREKA_DEFAULT_ZONE
        - name: EUREKA_HOSTNAME
          value: "eureka-server"
        - name: JAVA_TOOL_OPTIONS
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: JAVA_TOOL_OPTIONS
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_EXPORTER_OTLP_PROTOCOL
        - name: OTEL_METRICS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_METRICS_EXPORTER
        - name: OTEL_LOGS_EXPORTER
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_LOGS_EXPORTER
        - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
        - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
        - name: OTEL_SERVICE_NAME
          value: "eureka-server"

        resources:
          requests:
            cpu: "200m"
            memory: "400Mi"
          limits:
            cpu: "500m"
            memory: "700Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  selector:
    app: eureka-server
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8070
      targetPort: 8070
