apiVersion: v1
kind: Service
metadata:
  name: cards-db
  labels:
    app: cards-db
spec:
  selector:
    app: cards-db
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cards-db
  labels:
    app: cards-db
spec:
  serviceName: cards-db
  replicas: 1
  selector:
    matchLabels:
      app: cards-db
  template:
    metadata:
      labels:
        app: cards-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cards
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: cards-pg-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "cards"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: cards-pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-deployment
  labels:
    app: cards
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cards
  template:
    metadata:
      labels:
        app: cards
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:18-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h cards-db -p 5432 -U postgres -d cards; do
                echo "waiting for cards-db..."
                sleep 2
              done
      containers:
      - name: cards
        image: baicham/securedbank-cards-api:s15
        ports:
        - containerPort: 8092
        env:
        - name: SPRING_APPLICATION_NAME
          value: "cards"
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: SPRING_PROFILES_ACTIVE
        - name: CONFIG_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: CONFIG_SERVER_URL
        - name: SPRING_CONFIG_IMPORT
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_DEFAULT_ZONE
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: EUREKA_DEFAULT_ZONE
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: securedbank-configmap
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://cards-db:5432/cards"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "postgres"
        resources:
          requests:
            cpu: "200m"
            memory: "400Mi"
          limits:
            cpu: "500m"
            memory: "700Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cards
spec:
  selector:
    app: cards
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 8092
      targetPort: 8092

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cards-db
spec:
  podSelector:
    matchLabels:
      app: cards-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cards
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cards
spec:
  podSelector:
    matchLabels:
      app: cards
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-server
        - podSelector:
            matchLabels:
              app: accounts
      ports:
        - protocol: TCP
          port: 8092
