services:
  # Local/dev Kafka. See https://kafka.apache.org/43/getting-started/docker/
  # Equivalent: docker run -p 9092:9092 apache/kafka:4.3.1
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - 9092:9092
    extends:
      file: common-docker-config.yml
      service: shared-network
    deploy:
      resources:
        limits:
          memory: 1000m

networks:
  securedbank:
    driver: bridge
