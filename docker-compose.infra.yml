services:
  redis:
    image: 'redis:7-alpine'
    container_name: redis
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extends:
      file: common-docker-config.yml
      service: microservice-base
