{{- if .Values.resend.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.resend.secretName }}
  labels:
    app.kubernetes.io/name: securedbank
    app.kubernetes.io/component: resend
type: Opaque
stringData:
  RESEND_API_KEY: {{ required "resend.apiKey is required when resend.createSecret is true (never commit real keys)" .Values.resend.apiKey | quote }}
  RESEND_FROM: {{ .Values.resend.from | quote }}
{{- end }}
