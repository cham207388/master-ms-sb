global:
  # Docker Hub namespace for Spring app images only (securedbank-lib).
  # Do not name this imageRegistry — Grafana's chart treats global.imageRegistry as a registry host.
  appImageRegistry: baicham
  imageTag: s18
  configMapName: securedbank-configmap
  postgresImage: postgres:18-alpine
  postgresStorage: 1Gi
  postgresResources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  defaultResources:
    requests:
      cpu: "200m"
      memory: "400Mi"
    limits:
      cpu: "500m"
      memory: "700Mi"

configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: "prod"
    CONFIG_SERVER_URL: "http://config-server:8071/"
    SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8071/"
    EUREKA_DEFAULT_ZONE: "http://eureka-server:8070/eureka/"
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8070/eureka/"
    KEYCLOAK_JWK_SET_URI: "http://keycloak:7080/realms/securedbankdev/protocol/openid-connect/certs"
    KAFKA_BROKER: "kafka:19092"
    JAVA_TOOL_OPTIONS: "-javaagent:/app/libs/opentelemetry-javaagent.jar"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED: "false"
    OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED: "false"

# Resend (Message worker). Chart creates Secret by default with a placeholder key so Message can start.
# Override with a real key: --set resend.apiKey=re_xxx (never commit real keys).
# Or set createSecret=false and pre-create Secret named resend.secretName.
resend:
  createSecret: true
  secretName: resend-secret
  apiKey: "replace-me"
  from: "Securedbank <onboarding@resend.dev>"

kafka:
  enabled: true
  image: apache/kafka:4.3.1
  clusterId: "4L6g3nShT-eMCtK--X86sw"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

keycloak:
  enabled: true
  # Parent-only: used by templates/keycloak-db.yaml (ignored by keycloakx)
  dbPassword: keycloak-db-password
  # codecentric/keycloakx (alias: keycloak)
  fullnameOverride: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.7.0"
  # Image ENTRYPOINT is kc.sh; without args the pod exits immediately.
  args:
    - start
  http:
    relativePath: "/"
  proxy:
    enabled: false
  service:
    type: LoadBalancer
    httpPort: 7080
  database:
    vendor: postgres
    hostname: keycloak-db
    port: 5432
    database: keycloak
    username: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: KC_DB_PASSWORD
  dbchecker:
    enabled: true
  ingress:
    enabled: false
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: admin
    - name: KC_HOSTNAME
      value: "http://localhost:7080"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# Observability (Grafana Loki / Alloy / Tempo / Grafana + Prometheus)
# Toggle with <chart>.enabled; disable all for apps-only installs.
# ---------------------------------------------------------------------------

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    useTestSchema: true
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
    lokiCanary:
      enabled: false
  minio:
    enabled: false

alloy:
  enabled: true
  fullnameOverride: alloy
  alloy:
    mounts:
      varlog: true
    configMap:
      create: true
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          forward_to = [loki.write.default.receiver]

          stage.json {
            expressions = {
              level     = "level",
              timestamp = "timestamp",
              message   = "message",
              trace_id  = "trace_id",
            }
          }

          stage.labels {
            values = {
              level    = "",
              trace_id = "",
            }
          }
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
  controller:
    type: daemonset
    tolerations:
      - operator: Exists
        effect: NoSchedule

tempo:
  enabled: true
  fullnameOverride: tempo
  tempo:
    retention: 168h
    metricsGenerator:
      enabled: false
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

grafana:
  enabled: true
  fullnameOverride: grafana
  adminUser: admin
  adminPassword: admin
  service:
    type: LoadBalancer
    port: 3000
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://prometheus:9090
          access: proxy
          isDefault: true
        - name: Tempo
          type: tempo
          uid: tempo
          url: http://tempo:3200
          access: proxy
          jsonData:
            httpMethod: GET
            serviceMap:
              datasourceUid: prometheus
        - name: Loki
          type: loki
          uid: loki
          url: http://loki:3100
          access: proxy
          jsonData:
            derivedFields:
              - datasourceUid: tempo
                matcherRegex: "\\[.+,(.+),.+\\]"
                name: TraceID
                url: "$${__value.raw}"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

prometheus:
  enabled: true
  server:
    fullnameOverride: prometheus
    global:
      scrape_interval: 5s
      scrape_timeout: 5s
      evaluation_interval: 5s
    service:
      type: LoadBalancer
      servicePort: 9090
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  scrapeConfigs:
    prometheus:
      enabled: true
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-services-slow:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
    accounts:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["accounts:8091"]
    cards:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["cards:8092"]
    loans:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["loans:8093"]
    gateway-server:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["gateway-server:8072"]
    eureka-server:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["eureka-server:8070"]
    config-server:
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ["config-server:8071"]

services:
  config-server:
    enabled: true
    port: 8071
    image: securedbank-config-server
    serviceType: LoadBalancer
    springApplicationName: false
    database: false
    configMapKeys:
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: config-server

  eureka-server:
    enabled: true
    port: 8070
    image: securedbank-eureka-server
    serviceType: LoadBalancer
    database: false
    configMapKeys:
      - CONFIG_SERVER_URL
      - SPRING_CONFIG_IMPORT
      - EUREKA_DEFAULT_ZONE
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: EUREKA_HOSTNAME
        value: eureka-server
      - name: OTEL_SERVICE_NAME
        value: eureka-server

  accounts:
    enabled: true
    port: 8091
    image: securedbank-accounts-api
    serviceType: ClusterIP
    database: true
    kafkaBroker: true
    configMapKeys:
      - SPRING_PROFILES_ACTIVE
      - CONFIG_SERVER_URL
      - SPRING_CONFIG_IMPORT
      - EUREKA_DEFAULT_ZONE
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: accounts
    networkPolicy:
      enabled: true
      ingressFrom:
        - gateway-server
      ingressFromLabels:
        - app.kubernetes.io/name: prometheus

  cards:
    enabled: true
    port: 8092
    image: securedbank-cards-api
    serviceType: ClusterIP
    database: true
    configMapKeys:
      - SPRING_PROFILES_ACTIVE
      - CONFIG_SERVER_URL
      - SPRING_CONFIG_IMPORT
      - EUREKA_DEFAULT_ZONE
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: cards
    networkPolicy:
      enabled: true
      ingressFrom:
        - gateway-server
        - accounts
      ingressFromLabels:
        - app.kubernetes.io/name: prometheus

  loans:
    enabled: true
    port: 8093
    image: securedbank-loans-api
    serviceType: ClusterIP
    database: true
    configMapKeys:
      - SPRING_PROFILES_ACTIVE
      - CONFIG_SERVER_URL
      - SPRING_CONFIG_IMPORT
      - EUREKA_DEFAULT_ZONE
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: loans
    networkPolicy:
      enabled: true
      ingressFrom:
        - gateway-server
        - accounts
      ingressFromLabels:
        - app.kubernetes.io/name: prometheus

  message:
    enabled: true
    port: 9010
    image: securedbank-message
    serviceType: ClusterIP
    database: false
    kafkaBroker: true
    resendSecret: true
    configMapKeys:
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: message
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "512Mi"

  gateway-server:
    enabled: true
    port: 8072
    image: securedbank-gateway-server
    serviceType: LoadBalancer
    database: false
    configMapKeys:
      - SPRING_PROFILES_ACTIVE
      - CONFIG_SERVER_URL
      - SPRING_CONFIG_IMPORT
      - EUREKA_DEFAULT_ZONE
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
      - KEYCLOAK_JWK_SET_URI
      - JAVA_TOOL_OPTIONS
      - OTEL_EXPORTER_OTLP_ENDPOINT
      - OTEL_EXPORTER_OTLP_PROTOCOL
      - OTEL_METRICS_EXPORTER
      - OTEL_LOGS_EXPORTER
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_1_0_ENABLED
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_2_0_ENABLED
    extraEnv:
      - name: OTEL_SERVICE_NAME
        value: gateway-server
