server:
  port: 8072

spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
  cloud:
    config:
      override-none: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true


logging:
  level:
    org.springframework.amqp.rabbit.listener.BlockingQueueConsumer: ERROR
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: ERROR

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: unrestricted

eureka:
  instance:
    prefer-ip-address: true
    status-page-url: ${EUREKA_INSTANCE_STATUS_PAGE_URL:http://localhost:${server.port}/actuator/info}
    health-check-url: ${EUREKA_INSTANCE_HEALTH_CHECK_URL:http://localhost:${server.port}/actuator/health}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8070/eureka/}

info:
  app:
    name: ${spring.application.name}
    description: "Gateway Server"
    version: ${APP_VERSION:1.0.0}
