server:
  port: 8072

spring:
  application:
    name: gateway-server
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071/}"
  cloud:
    config:
      override-none: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s


logging:
  level:
    com:
      abcham:
        gatewayserver: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id}]"
  structured:
    format:
      console: ecs
      file: ecs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name}

  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: unrestricted

eureka:
  instance:
    prefer-ip-address: true
    status-page-url: http://localhost:${server.port}/actuator/info
    health-check-url: http://localhost:${server.port}/actuator/health
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8070/eureka/}

info:
  app:
    name: ${spring.application.name}
    description: "Gateway Server"
    version: ${APP_VERSION:1.0.0}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
